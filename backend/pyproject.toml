[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotrace-backend"
version = "0.1.0"
description = "Research-only AE300 telemetry and hybrid anomaly backend"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
aerotrace = "aerotrace.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aerotrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

